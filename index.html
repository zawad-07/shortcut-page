<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Zawad's Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --glass: rgba(255,255,255,0.07);
      --glass-border: rgba(255,255,255,0.12);
      --accent: #7DF9C2;
      --accent2: #5B8DEF;
      --danger: #FF5E7D;
      --text: #f0f0f0;
      --muted: #888;
      --modal-bg: rgba(10,10,20,0.92);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: #0a0a0f;
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Noise overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
    }

    .page-wrap {
      position: relative;
      z-index: 1;
      padding: 40px 20px 80px;
    }

    /* HEADER */
    header {
      text-align: center;
      margin-bottom: 32px;
    }

    header h1 {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: clamp(28px, 5vw, 52px);
      letter-spacing: 0.12em;
      background: linear-gradient(120deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    header p {
      font-size: 12px;
      color: var(--muted);
      letter-spacing: 0.2em;
      margin-top: 4px;
      text-transform: uppercase;
    }

    /* SEARCH */
    .search-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 40px;
    }

    .search-container {
      display: flex;
      align-items: center;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: 50px;
      padding: 10px 20px;
      width: 100%;
      max-width: 420px;
      backdrop-filter: blur(12px);
      transition: border-color 0.3s, box-shadow 0.3s;
    }

    .search-container:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(125,249,194,0.12);
    }

    .search-container input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
    }

    .search-container input::placeholder { color: var(--muted); }

    .search-container button {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 18px;
      cursor: pointer;
      transition: color 0.2s;
      padding: 0;
      line-height: 1;
    }

    .search-container button:hover { color: var(--accent); }

    /* GRID / DRAG AREA */
    #shortcutGrid {
      position: relative;
      min-height: 300px;
      width: 100%;
      padding: 0 20px;
    }

    /* TILES */
    .tile {
      position: absolute;
      width: 110px;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      text-align: center;
      padding: 14px 8px 10px;
      cursor: default;
      backdrop-filter: blur(10px);
      transition: box-shadow 0.2s, border-color 0.2s, transform 0.15s;
      user-select: none;
    }

    .tile:hover {
      border-color: rgba(255,255,255,0.25);
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }

    .tile.dragging {
      cursor: grabbing;
      opacity: 0.85;
      box-shadow: 0 16px 48px rgba(0,0,0,0.6);
      transform: scale(1.06);
      z-index: 9999 !important;
    }

    .tile img {
      width: 32px;
      height: 32px;
      margin-bottom: 8px;
      border-radius: 6px;
    }

    .tile a {
      text-decoration: none;
      color: var(--text);
      font-size: 13px;
      font-weight: 500;
      display: block;
      line-height: 1.3;
      pointer-events: none; /* let drag handle it; we open via click separately */
    }

    .tile-name {
      font-size: 12px;
      color: var(--text);
      margin-top: 2px;
      word-break: break-word;
    }

    .tile-actions {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin-top: 8px;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .tile:hover .tile-actions { opacity: 1; }

    .tile-actions button {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.1);
      color: #ccc;
      font-size: 11px;
      border-radius: 6px;
      padding: 3px 7px;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }

    .tile-actions button:hover { background: rgba(255,255,255,0.18); color: #fff; }
    .tile-actions .del-btn:hover { background: rgba(255,94,125,0.25); color: var(--danger); border-color: var(--danger); }

    /* DRAG HANDLE */
    .drag-handle {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      cursor: grab;
      border-radius: 6px;
      padding: 3px 5px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.1);
      transition: background 0.2s;
      height: 100%;
      min-height: 24px;
    }

    .drag-handle:active { cursor: grabbing; }

    .drag-handle .dot-row {
      display: flex;
      gap: 3px;
    }

    .drag-handle .dot {
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: rgba(255,255,255,0.55);
      transition: background 0.2s;
    }

    .drag-handle:hover .dot { background: var(--accent); }

    .drag-handle:hover {
      background: rgba(125,249,194,0.12);
      border-color: rgba(125,249,194,0.3);
    }

    /* ADD TILE */
    .plus-tile {
      width: 110px;
      position: absolute;
      background: rgba(125,249,194,0.05);
      border: 1.5px dashed rgba(125,249,194,0.3);
      border-radius: 16px;
      text-align: center;
      padding: 14px 8px 10px;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
      backdrop-filter: blur(10px);
    }

    .plus-tile:hover {
      background: rgba(125,249,194,0.1);
      border-color: var(--accent);
    }

    .plus-tile .plus-icon {
      font-size: 26px;
      color: var(--accent);
      line-height: 1;
    }

    .plus-tile .plus-label {
      font-size: 11px;
      color: var(--muted);
      margin-top: 6px;
    }

    /* ===== MODAL ===== */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(6px);
      z-index: 10000;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: all;
    }

    .modal {
      background: #12121e;
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      padding: 36px 32px 28px;
      width: 100%;
      max-width: 380px;
      position: relative;
      transform: translateY(24px) scale(0.96);
      transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
      box-shadow: 0 32px 80px rgba(0,0,0,0.6);
    }

    .modal-overlay.active .modal {
      transform: translateY(0) scale(1);
    }

    .modal h2 {
      font-family: 'Syne', sans-serif;
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 6px;
      color: #fff;
    }

    .modal p.sub {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 24px;
    }

    .modal-field {
      margin-bottom: 16px;
    }

    .modal-field label {
      display: block;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .modal-field input {
      width: 100%;
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      padding: 11px 14px;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .modal-field input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(125,249,194,0.1);
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 24px;
    }

    .btn {
      flex: 1;
      padding: 12px;
      border-radius: 12px;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #0a0a0f;
      font-weight: 600;
    }

    .btn-primary:hover { filter: brightness(1.1); transform: translateY(-1px); }

    .btn-ghost {
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--glass-border);
      color: var(--muted);
    }

    .btn-ghost:hover { background: rgba(255,255,255,0.12); color: var(--text); }

    .modal-close {
      position: absolute;
      top: 16px;
      right: 18px;
      background: none;
      border: none;
      color: var(--muted);
      font-size: 22px;
      cursor: pointer;
      line-height: 1;
      transition: color 0.2s;
    }

    .modal-close:hover { color: var(--text); }

    /* FAVICON PREVIEW IN MODAL */
    .favicon-preview {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 12px;
      padding: 10px 14px;
      background: rgba(255,255,255,0.04);
      border-radius: 10px;
      min-height: 44px;
    }

    .favicon-preview img { width: 24px; height: 24px; border-radius: 4px; }
    .favicon-preview span { font-size: 12px; color: var(--muted); }

    /* BG BUTTON */
    .fixed-btns {
      position: fixed;
      bottom: 20px;
      right: 20px;
      display: flex;
      gap: 10px;
      z-index: 500;
    }

    #add-btn, #bg-btn {
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: 50%;
      width: 46px;
      height: 46px;
      font-size: 20px;
      color: white;
      cursor: pointer;
      backdrop-filter: blur(10px);
      transition: background 0.2s, transform 0.2s;
    }

    #add-btn:hover, #bg-btn:hover { background: rgba(255,255,255,0.15); transform: scale(1.08); }
    #add-btn { font-size: 24px; line-height: 1; }
    #bg-input { display: none; }

    /* TOAST */
    .toast {
      position: fixed;
      bottom: 76px;
      right: 20px;
      background: var(--accent);
      color: #0a0a0f;
      font-size: 13px;
      font-weight: 600;
      padding: 10px 18px;
      border-radius: 50px;
      z-index: 9999;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.3s, transform 0.3s;
    }

    .toast.show { opacity: 1; transform: translateY(0); }
  </style>
</head>
<body>

<div class="page-wrap">
  <header>
    <h1>ZAWAD RAHMAN</h1>
    <p>Personal Dashboard</p>
  </header>

  <div class="search-wrap">
    <form action="https://www.google.com/search" method="GET" class="search-container">
      <input type="text" name="q" placeholder="Search Google…" autofocus>
      <button type="submit">🔍</button>
    </form>
  </div>

  <div id="shortcutGrid"></div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modal">
    <button class="modal-close" id="modalClose">×</button>
    <h2 id="modalTitle">Add Shortcut</h2>
    <p class="sub" id="modalSub">Add a new site to your dashboard</p>

    <div class="modal-field">
      <label>Site Name</label>
      <input type="text" id="inputName" placeholder="e.g. GitHub" autocomplete="off">
    </div>

    <div class="modal-field">
      <label>URL</label>
      <input type="text" id="inputUrl" placeholder="https://example.com" autocomplete="off">
    </div>

    <div class="favicon-preview" id="faviconPreview">
      <span>Enter a URL to preview favicon</span>
    </div>

    <div class="modal-actions">
      <button class="btn btn-ghost" id="modalCancel">Cancel</button>
      <button class="btn btn-primary" id="modalSave">Save Shortcut</button>
    </div>
  </div>
</div>

<div class="fixed-btns">
  <button id="add-btn" onclick="openModal('add')" title="Add shortcut">＋</button>
  <button id="bg-btn" onclick="document.getElementById('bg-input').click()" title="Change background">🖼️</button>
</div>
<input type="file" id="bg-input" accept="image/*" onchange="changeBackground(this)" />
<div class="toast" id="toast"></div>

<script>
  const grid = document.getElementById('shortcutGrid');
  const TILE_W = 110, TILE_H = 120, GAP = 16, COLS_BASE = 8;

  // ─── State ───────────────────────────────────────────────────────────────
  let shortcuts = JSON.parse(localStorage.getItem('shortcuts_v2')) || [
    { name: 'YouTube',  url: 'https://youtube.com'        },
    { name: 'ChatGPT',  url: 'https://chat.openai.com'    },
    { name: 'GitHub',   url: 'https://github.com'         },
    { name: 'Coursera', url: 'https://coursera.org'       },
    { name: 'Gmail',    url: 'https://mail.google.com'    },
  ];

  let positions = JSON.parse(localStorage.getItem('positions_v2')) || null;

  function defaultPositions() {
    const cols = Math.max(1, Math.floor((grid.clientWidth || 800) / (TILE_W + GAP)));
    return shortcuts.map((_, i) => ({
      x: (i % cols) * (TILE_W + GAP),
      y: Math.floor(i / cols) * (TILE_H + GAP)
    }));
  }

  function ensurePositions() {
    if (!positions || positions.length !== shortcuts.length) {
      positions = defaultPositions();
      savePositions();
    }
  }

  function savePositions() {
    localStorage.setItem('positions_v2', JSON.stringify(positions));
  }

  function saveShortcuts() {
    localStorage.setItem('shortcuts_v2', JSON.stringify(shortcuts));
  }

  function getFavicon(url) {
    try { return `https://www.google.com/s2/favicons?domain=${new URL(url).hostname}&sz=64`; }
    catch { return ''; }
  }

  // ─── Render ───────────────────────────────────────────────────────────────
  function render() {
    ensurePositions();
    grid.innerHTML = '';

    // Calculate grid height
    let maxY = 0;
    positions.forEach((p, i) => { if (i < shortcuts.length) maxY = Math.max(maxY, p.y + TILE_H); });

    shortcuts.forEach((sc, i) => {
      const tile = document.createElement('div');
      tile.className = 'tile';
      tile.dataset.index = i;
      tile.style.left = positions[i].x + 'px';
      tile.style.top  = positions[i].y + 'px';
      tile.style.zIndex = i + 1;

      tile.innerHTML = `
        <img src="${getFavicon(sc.url)}" alt="" draggable="false" />
        <div class="tile-name">${sc.name}</div>
        <div class="tile-actions">
          <div class="drag-handle" title="Drag to move">
            <div class="dot-row"><span class="dot"></span><span class="dot"></span></div>
            <div class="dot-row"><span class="dot"></span><span class="dot"></span></div>
            <div class="dot-row"><span class="dot"></span><span class="dot"></span></div>
          </div>
          <button class="edit-btn" title="Edit">✏️</button>
          <button class="del-btn" title="Delete">🗑️</button>
        </div>
      `;

      // Click to navigate (only if not dragging)
      tile.addEventListener('click', (e) => {
        if (!tile._wasDragged) window.open(sc.url, '_self');
      });

      tile.querySelector('.edit-btn').addEventListener('click', e => {
        e.stopPropagation(); openModal('edit', i);
      });
      tile.querySelector('.del-btn').addEventListener('click', e => {
        e.stopPropagation(); deleteShortcut(i);
      });

      makeDraggable(tile, tile.querySelector('.drag-handle'), i);
      grid.appendChild(tile);
    });

    const minGridH = window.innerHeight - grid.getBoundingClientRect().top + 200;
    grid.style.height = Math.max(minGridH, maxY + TILE_H + GAP + 200) + 'px';
  }

  // ─── Drag ─────────────────────────────────────────────────────────────────
  function makeDraggable(tile, handle, index) {
    let startX, startY, origLeft, origTop, dragging = false, moved = false;

    const onDown = (e) => {
      e.preventDefault();
      dragging = true;
      moved = false;
      tile._wasDragged = false;

      const point = e.touches ? e.touches[0] : e;
      startX = point.clientX;
      startY = point.clientY;
      origLeft = positions[index].x;
      origTop  = positions[index].y;

      tile.classList.add('dragging');
      tile.style.zIndex = 9999;

      const onMove = (e) => {
        if (!dragging) return;
        const pt = e.touches ? e.touches[0] : e;
        const dx = pt.clientX - startX;
        const dy = pt.clientY - startY;
        if (Math.abs(dx) > 3 || Math.abs(dy) > 3) { moved = true; tile._wasDragged = true; }

        const maxX = grid.clientWidth - TILE_W - 60;
        const maxY = grid.clientHeight - TILE_H - 80;
        const newX = Math.min(maxX, Math.max(0, origLeft + dx));
        const newY = Math.min(maxY, Math.max(0, origTop + dy));
        tile.style.left = newX + 'px';
        tile.style.top  = newY + 'px';
        positions[index] = { x: newX, y: newY };
      };

      const onUp = () => {
        dragging = false;
        tile.classList.remove('dragging');
        tile.style.zIndex = index + 1;
        savePositions();
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onUp);
        document.removeEventListener('touchmove', onMove);
        document.removeEventListener('touchend', onUp);
      };

      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
      document.addEventListener('touchmove', onMove, { passive: false });
      document.addEventListener('touchend', onUp);
    };

    handle.addEventListener('mousedown', onDown);
    handle.addEventListener('touchstart', onDown, { passive: false });
  }

  // ─── Modal ────────────────────────────────────────────────────────────────
  const overlay   = document.getElementById('modalOverlay');
  const modalTitle = document.getElementById('modalTitle');
  const modalSub  = document.getElementById('modalSub');
  const inputName = document.getElementById('inputName');
  const inputUrl  = document.getElementById('inputUrl');
  const faviconPreview = document.getElementById('faviconPreview');
  let   editingIndex = null;

  function openModal(mode, index = null) {
    editingIndex = index;
    if (mode === 'add') {
      modalTitle.textContent = 'Add Shortcut';
      modalSub.textContent   = 'Add a new site to your dashboard';
      document.getElementById('modalSave').textContent = 'Add Shortcut';
      inputName.value = '';
      inputUrl.value  = '';
      faviconPreview.innerHTML = '<span>Enter a URL to preview favicon</span>';
    } else {
      const sc = shortcuts[index];
      modalTitle.textContent = 'Edit Shortcut';
      modalSub.textContent   = 'Update site details';
      document.getElementById('modalSave').textContent = 'Save Changes';
      inputName.value = sc.name;
      inputUrl.value  = sc.url;
      updateFaviconPreview(sc.url, sc.name);
    }
    overlay.classList.add('active');
    setTimeout(() => inputName.focus(), 100);
  }

  function closeModal() { overlay.classList.remove('active'); }

  function updateFaviconPreview(url, name = '') {
    const src = getFavicon(url);
    if (src) {
      faviconPreview.innerHTML = `<img src="${src}" alt="" /><span>${name || new URL(url).hostname}</span>`;
    } else {
      faviconPreview.innerHTML = '<span>Enter a valid URL</span>';
    }
  }

  inputUrl.addEventListener('input', () => {
    try { updateFaviconPreview(inputUrl.value, inputName.value); } catch {}
  });

  document.getElementById('modalSave').addEventListener('click', () => {
    const name = inputName.value.trim();
    let url = inputUrl.value.trim();
    if (!name || !url) return;
    if (!/^https?:\/\//i.test(url)) url = 'https://' + url;

    if (editingIndex === null) {
      shortcuts.push({ name, url });
      positions.push(getNextFreePosition());
    } else {
      shortcuts[editingIndex] = { name, url };
    }
    saveShortcuts();
    savePositions();
    closeModal();
    render();
    showToast(editingIndex === null ? 'Shortcut added!' : 'Shortcut updated!');
  });

  document.getElementById('modalCancel').addEventListener('click', closeModal);
  document.getElementById('modalClose').addEventListener('click', closeModal);
  overlay.addEventListener('click', (e) => { if (e.target === overlay) closeModal(); });

  // Keyboard
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

  function getNextFreePosition() {
    const cols = Math.max(1, Math.floor((grid.clientWidth || 800) / (TILE_W + GAP)));
    const i = shortcuts.length - 1;
    return { x: (i % cols) * (TILE_W + GAP), y: Math.floor(i / cols) * (TILE_H + GAP) };
  }

  // ─── Delete ───────────────────────────────────────────────────────────────
  function deleteShortcut(i) {
    shortcuts.splice(i, 1);
    positions.splice(i, 1);
    saveShortcuts();
    savePositions();
    render();
    showToast('Shortcut removed');
  }

  // ─── Background ───────────────────────────────────────────────────────────
  function changeBackground(input) {
    const file = input.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      document.body.style.backgroundImage = `url('${reader.result}')`;
      localStorage.setItem('bg_v2', reader.result);
    };
    reader.readAsDataURL(file);
  }

  const savedBg = localStorage.getItem('bg_v2');
  if (savedBg) document.body.style.backgroundImage = `url('${savedBg}')`;

  // ─── Toast ────────────────────────────────────────────────────────────────
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2200);
  }

  // ─── Init ─────────────────────────────────────────────────────────────────
  render();
</script>
</body>
</html>
